name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Netlify production deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
        run: npm run build

      - name: Verify Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "::error title=Missing Secret::NETLIFY_AUTH_TOKEN is not configured in repository Secrets."
            echo "Please add NETLIFY_AUTH_TOKEN in Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "::error title=Missing Secret::NETLIFY_SITE_ID is not configured in repository Secrets."
            echo "Please add NETLIFY_SITE_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Netlify CLI
        run: npm i -g netlify-cli

      - name: Deploy to Netlify
        timeout-minutes: 30
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          netlify deploy \
            --dir=dist \
            --prod \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID" \
            --message "Auto deploy from GitHub Actions"
