<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KART CLUB · 海岸参考试驾</title></head>
<body><header><a href="/" class="brand">KART CLUB</a><span class="title">海岸参考样板</span><nav aria-label="画面和驾驶"><button disabled data-view="front" aria-pressed="true">正面机位</button><button disabled data-view="rear" aria-pressed="false">后方机位</button><button disabled id="manual" class="primary">进入试驾</button><button id="pause" hidden>暂停</button><button id="restart" hidden>重新开始</button></nav><label class="quality">画质 <select id="quality"><option value="high">高</option><option value="low">流畅</option></select></label><a href="/">返回大厅 ↗</a></header>
<main><canvas id="scene" tabindex="0" aria-label="海岸卡丁车 3D 场景"></canvas><div id="hud" hidden><section class="progress"><small>海岸自由试驾</small><b id="clock">00:00</b><span id="distance">0 m</span></section><section class="instruments"><div><b id="speed">0</b><span>KM/H</span></div><label id="nitro-label" for="charge">正在集气 · 库存 0 / 2</label><progress id="charge" max="100" value="0"></progress><p id="drive-status">WASD / 方向键 · Shift 漂移 · Ctrl 氮气 · R 复位</p></section><p id="paused" hidden>已暂停</p></div></main>
<footer><span id="status" role="status">正在载入场景…</span><span>WASD / 方向键驾驶 · Esc 暂停</span></footer><script type="module" src="/client/reference.ts"></script></body></html>
